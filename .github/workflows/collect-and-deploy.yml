name: Collect data and deploy site

on:
  schedule:
    - cron: "23 * * * *"   # hourly, at :23 (GitHub delays jobs scheduled on the hour)
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (blank = all)"
        required: false
        default: ""
  push:
    paths: ["site/**", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hateindex
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test classifier
        run: cd pipeline && python -m unittest discover -s tests -v

      - name: Load stored data
        # Raw posts and collector progress live on the `data` branch, not main,
        # so hourly runs don't bloat main's history. Until that branch exists,
        # the data/ folder checked out from main is the starting point.
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            rm -rf data
            git archive FETCH_HEAD data | tar -x
            echo "loaded data branch"
          else
            echo "no data branch yet; starting from main's data/"
          fi

      - name: Collect public data
        if: github.event_name != 'push'
        env:
          HATEINDEX_SALT: ${{ secrets.HATEINDEX_SALT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            python -m pipeline.hateindex collect --sources "${{ github.event.inputs.sources }}"
          else
            python -m pipeline.hateindex collect
          fi

      - name: Build index
        run: python -m pipeline.hateindex build

      - name: Save data
        # One commit, overwritten each run: the data branch is a snapshot, not a history.
        if: github.event_name != 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          store="$RUNNER_TEMP/store"
          rm -rf "$store" && mkdir -p "$store"
          cp -r data "$store/"
          cd "$store"
          git init -q -b data
          git config user.name "hateindex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data snapshot $(date -u +'%F %H:%M') UTC"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    # Pages only accepts deploys from main; other branches just test and build.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
